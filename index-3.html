<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="دیجی تک؛ فروش موبایل و لوازم جانبی"><title>دیجی تک | فروش موبایل و لوازم جانبی</title>
<style>
:root{--ink:#151827;--muted:#6b7280;--bg:#f6f7fb;--card:#fff;--accent:#5b4bdb;--line:#e7e8ef;--ok:#16835b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:16px}.top{background:linear-gradient(135deg,#171923,#2b2850);color:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 30px #1112}.bar{display:flex;align-items:center;justify-content:space-between;gap:14px}.logo{font-size:30px;font-weight:900}.logo span{color:#9b8cff}.tag{color:#d8d5ef;font-size:13px;margin-top:5px}.search{width:100%;margin-top:18px;padding:14px 16px;border:0;border-radius:14px;font-size:15px;outline:0}.cats{display:flex;gap:9px;overflow:auto;padding:18px 0 8px}.cat{border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:999px;white-space:nowrap;cursor:pointer}.cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}.tools{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);padding:13px;border-radius:18px;border:1px solid var(--line);box-shadow:0 5px 18px #1111}.pic{height:175px;background:#f0f0f6;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:68px}.brand{font-size:12px;color:var(--muted);margin-top:11px}.name{font-weight:800;margin:6px 0;min-height:40px;line-height:1.6}.price{font-size:17px;font-weight:900}.old{color:#9ca3af;text-decoration:line-through;font-size:11px;margin-right:7px}.stock{font-size:12px;color:var(--ok);margin-top:5px}.add{width:100%;margin-top:11px;padding:11px;border:0;border-radius:11px;background:var(--accent);color:white;font-weight:800;cursor:pointer}.add:disabled{background:#bbb;cursor:not-allowed}.cart{position:sticky;bottom:12px;margin:22px 0 4px;background:var(--ink);color:#fff;border-radius:15px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.checkout{padding:9px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.empty{text-align:center;padding:40px;background:#fff;border-radius:18px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#151827;color:#fff;padding:11px 16px;border-radius:12px;display:none;z-index:10}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:140px;font-size:55px}.logo{font-size:25px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.pic{height:160px}}
</style></head>
<body><main class="wrap"><header class="top"><div class="bar"><div><div class="logo">دیجی<span>تک</span></div><div class="tag">فروش موبایل و لوازم جانبی</div></div><div>🛒</div></div><input class="search" id="q" placeholder="جستجوی محصول یا برند..." autocomplete="off"></header><nav class="cats" id="cats"></nav><div class="tools"><div class="count" id="countProducts"></div><div>مرتب‌سازی: <select id="sort"><option value="new">پیش‌فرض</option><option value="low">ارزان‌ترین</option><option value="high">گران‌ترین</option></select></div></div><section class="grid" id="grid"></section><div class="cart"><span>🛒 سبد خرید: <b id="cartCount">۰</b> کالا</span><button class="checkout" onclick="checkout()">ثبت سفارش</button></div><footer>دیجی تک — فروش موبایل و لوازم جانبی</footer></main><div class="toast" id="toast"></div>
<script>
let all=[],cart=[],cat='همه';const money=n=>new Intl.NumberFormat('fa-IR').format(n)+' تومان';
const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
async function load(){try{const r=await fetch('/api/products');if(!r.ok)throw 0;all=await r.json();cats();render()}catch(e){$('grid').innerHTML='<div class="empty">اتصال به فروشگاه برقرار نشد.</div>'}}
function cats(){const c=['همه',...new Set(all.map(x=>x.cat).filter(Boolean))];$('cats').innerHTML=c.map(x=>`<button class="cat ${x===cat?'active':''}" onclick="cat=${JSON.stringify(x)};cats();render()">${x}</button>`).join('')}
function render(){let q=$('q').value.trim().toLowerCase();let a=all.filter(x=>(cat==='همه'||x.cat===cat)&&(String(x.name)+' '+String(x.brand)).toLowerCase().includes(q));if($('sort').value==='low')a.sort((x,y)=>x.price-y.price);if($('sort').value==='high')a.sort((x,y)=>y.price-x.price);$('countProducts').textContent=new Intl.NumberFormat('fa-IR').format(a.length)+' محصول';$('grid').innerHTML=a.length?a.map(x=>`<article class="card"><div class="pic">${x.emoji||'📦'}</div><div class="brand">${x.brand||''}</div><div class="name">${x.name}</div><div class="price">${money(x.price)} ${x.old?`<span class="old">${money(x.old)}</span>`:''}</div><div class="stock">${x.qty>0?'موجود':'ناموجود'}</div><button class="add" ${x.qty<=0?'disabled':''} onclick="add(${x.id})">${x.qty>0?'افزودن به سبد':'ناموجود'}</button></article>`).join(''):'<div class="empty">محصولی پیدا نشد.</div>'}
function add(id){const p=all.find(x=>x.id===id);if(!p||p.qty<1)return;cart.push(p);$('cartCount').textContent=new Intl.NumberFormat('fa-IR').format(cart.length);toast('به سبد خرید اضافه شد')}
async function checkout(){if(!cart.length)return toast('سبد خرید خالی است');const customer=prompt('نام و نام خانوادگی:');if(!customer)return;const phone=prompt('شماره موبایل:');if(!phone)return;const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer,phone,items:cart.map(x=>x.id),total:cart.reduce((s,x)=>s+x.price,0)})});if(r.ok){cart=[];$('cartCount').textContent='۰';toast('سفارش شما ثبت شد')}else toast('ثبت سفارش ناموفق بود')}
$('q').oninput=render;$('sort').onchange=render;load();
</script></body></html>
